# Unit tests on a GPU-less Windows runner. s2.cpp, the model and HTTP are stubbed in the tests,
# so no engine build or model download happens here; real synthesis is checked on a GPU machine.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: skills/presenter/tools/uv.lock
      # Several tests skip without FFmpeg; install it so every test actually runs.
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      # The presenter skill carries its own uv project, as installed by `npx skills add`.
      - name: Install dependencies from uv.lock
        working-directory: skills/presenter/tools
        run: uv sync --locked
      - name: Run tests
        working-directory: skills/presenter/tools
        run: uv run python -m unittest discover -s tests -v
