<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrated deck</title>
<style>
  :root { --bg: #111317; --bar: #1c1f25; --text: #e8eaee; --muted: #9aa1ad; --accent: #5aa9ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, "Yu Gothic UI", "Hiragino Sans", sans-serif; }
  #stage { flex: 1; position: relative; overflow: hidden; }
  /* html-deck slides are a fixed 1600x900 canvas; scale the whole frame to fit the window. */
  #slide { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; border: 0;
           background: #fff; transform-origin: center; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bar); }
  #bar button { min-width: 44px; min-height: 36px; border: 1px solid #39404b; border-radius: 6px;
                background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  #bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #label { min-width: 0; flex: 0 1 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #label b { color: var(--accent); font-weight: 600; margin-right: 8px; }
  audio { flex: 1; min-width: 200px; }
  #help { color: var(--muted); font-size: 13px; white-space: nowrap; }
  @media (max-width: 640px) { #help { display: none; } }
</style>
</head>
<body>
<main id="stage"><iframe id="slide" title="スライド"></iframe></main>
<nav id="bar" aria-label="再生">
  <button id="prev" type="button" aria-label="前のスライド">◀</button>
  <span id="label" aria-live="polite"></span>
  <button id="next" type="button" aria-label="次のスライド">▶</button>
  <audio id="audio" controls preload="auto" src="narration.wav"></audio>
  <span id="help">Space: 再生/停止 ・ ←→: スライド移動</span>
</nav>
<script>
const timeline = /*TIMELINE*/null;
const slides = timeline.slides;
const stage = document.getElementById("stage");
const frame = document.getElementById("slide");
const audio = document.getElementById("audio");
const label = document.getElementById("label");
let current = -1;

function fit() {
  const scale = Math.min(stage.clientWidth / 1600, stage.clientHeight / 900);
  frame.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

function show(index) {
  if (index === current) return;
  current = index;
  frame.src = slides[index].slide;
  label.innerHTML = "";
  const count = document.createElement("b");
  count.textContent = `${index + 1} / ${slides.length}`;
  label.append(count, document.createTextNode(slides[index].title));
  document.title = slides[index].title;
}

function indexAt(time) {
  let index = 0;
  slides.forEach((s, i) => { if (time >= s.start) index = i; });
  return index;
}

function jump(index) {
  const target = Math.max(0, Math.min(slides.length - 1, index));
  audio.currentTime = slides[target].start + 0.01;
  show(target);
}

audio.addEventListener("timeupdate", () => show(indexAt(audio.currentTime)));
audio.addEventListener("seeked", () => show(indexAt(audio.currentTime)));
document.getElementById("prev").addEventListener("click", () => jump(current - 1));
document.getElementById("next").addEventListener("click", () => jump(current + 1));
document.addEventListener("keydown", (event) => {
  if (event.target === audio) return;  // Let the audio element keep its own keys.
  if (event.key === " ") { event.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
  if (event.key === "ArrowRight") jump(current + 1);
  if (event.key === "ArrowLeft") jump(current - 1);
});
window.addEventListener("resize", fit);
fit();
show(0);
</script>
</body>
</html>
