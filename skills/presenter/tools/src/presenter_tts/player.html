<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Narrated deck</title>
<script>
  // Apply the saved theme before first paint so the page does not flash.
  try { const saved = localStorage.getItem("presenter-theme"); if (saved) document.documentElement.dataset.theme = saved; } catch {}
</script>
<style>
  /* Layout and type follow Apple's HIG (Liquid Glass: floating translucent layers, specular edges,
     concentric corners); state layers, color roles and the filter chip follow Material 3. */

  /* Palette: Microsoft PowerPoint's warm oranges. Every accent below comes from these four, so a new
     pattern is a new set of four. Gradients turn at 38.2% (golden ratio), tints are 1/φ powers
     (14.6%, 23.6%), and geometry uses Fibonacci steps (5, 8, 13, 21, 34) so nested corners stay
     concentric (21 − 8 = 13). The background stays neutral; color is kept for what people act on. */
  :root {
    --pp-deep: #c43e1c; --pp-strong: #d35230; --pp-bright: #ed6c47; --pp-light: #ff8f6b;
    /* White text stays above 4.5:1 on this one, so it carries labels (buttons, current time). */
    --brand: linear-gradient(135deg in oklch, var(--pp-deep), 38.2%, var(--pp-strong));
    /* Decoration only: progress, the current slide's ring. */
    --brand-glow: linear-gradient(90deg in oklch, var(--pp-deep), 38.2%, var(--pp-light));
    --s1: 5px; --s2: 8px; --s3: 13px; --s4: 21px; --s5: 34px;
    --r-pane: 21px; --r-item: 13px; --r-small: 8px;

    --bg: #f5f5f7;
    --glass: rgba(255, 255, 255, .62); --glass-strong: rgba(255, 255, 255, .82); --field: rgba(118, 118, 128, .12);
    --edge: rgba(255, 255, 255, .8); --hairline: rgba(0, 0, 0, .08); --lift: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 34px rgba(0, 0, 0, .07);
    --on-surface: #1d1d1f; --on-surface-variant: #6e6e73;
    --primary: var(--pp-deep); --on-primary: #fff;
    --primary-container: color-mix(in oklch, var(--pp-bright) 14.6%, transparent); --on-primary-container: #9e2f12;
    --mark: rgba(255, 204, 0, .45);
  }
  :root[data-theme="dark"] {
    --bg: #0e0e10;
    --glass: rgba(36, 36, 40, .62); --glass-strong: rgba(46, 46, 50, .85); --field: rgba(118, 118, 128, .24);
    --edge: rgba(255, 255, 255, .12); --hairline: rgba(255, 255, 255, .08); --lift: 0 8px 34px rgba(0, 0, 0, .5);
    --on-surface: #f5f5f7; --on-surface-variant: #a1a1a6;
    --primary: var(--pp-light); --on-primary: #3a0f02;
    --primary-container: color-mix(in oklch, var(--pp-bright) 23.6%, transparent); --on-primary-container: #ffc7b3;
    --mark: rgba(255, 214, 10, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e10;
      --glass: rgba(36, 36, 40, .62); --glass-strong: rgba(46, 46, 50, .85); --field: rgba(118, 118, 128, .24);
      --edge: rgba(255, 255, 255, .12); --hairline: rgba(255, 255, 255, .08); --lift: 0 8px 34px rgba(0, 0, 0, .5);
      --on-surface: #f5f5f7; --on-surface-variant: #a1a1a6;
      --primary: var(--pp-light); --on-primary: #3a0f02;
      --primary-container: color-mix(in oklch, var(--pp-bright) 23.6%, transparent); --on-primary-container: #ffc7b3;
      --mark: rgba(255, 214, 10, .35);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    color: var(--on-surface); -webkit-font-smoothing: antialiased;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          "Yu Gothic UI", "Segoe UI", Meiryo, system-ui, sans-serif;
    background: var(--bg);
    /* The app fills the window: header on top, panes stretched to the bottom edge. */
    height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* Liquid Glass surface: translucent fill, blur, a bright top edge and a soft lift. */
  .glass {
    background: var(--glass); border: 1px solid var(--edge);
    backdrop-filter: blur(34px) saturate(180%); -webkit-backdrop-filter: blur(34px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -1px 0 rgba(255, 255, 255, .06), var(--lift);
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass { background: var(--glass-strong); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }

  /* Material 3 state layer: an overlay of the content color at 8% (hover) / 10% (focus, pressed). */
  .state { position: relative; isolation: isolate; cursor: pointer; }
  .state::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
                   background: currentColor; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .state:hover::before { opacity: .08; }
  .state:focus-visible::before, .state:active::before { opacity: .10; }

  /* Toolbar: a floating glass capsule. */
  header { position: relative; z-index: 5; display: flex; align-items: center; gap: var(--s3);
           margin: var(--s3) var(--s4) 0; padding: var(--s2) var(--s2) var(--s2) var(--s4); border-radius: 999px; }
  header h1 { flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .segmented { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--field); }
  .segmented button { display: inline-grid; place-items: center; width: 34px; height: 30px; padding: 0; border: 0;
                      border-radius: 999px; background: none; color: var(--on-surface-variant); }
  .segmented button[aria-pressed="true"] { background: var(--glass-strong); color: var(--on-surface);
                                           box-shadow: 0 1px 4px rgba(0, 0, 0, .15), inset 0 1px 0 var(--edge); }
  .segmented svg { width: 18px; height: 18px; }
  .pane-toggle { display: inline-grid; place-items: center; flex: none; width: 34px; height: 34px; padding: 0; border: 0;
                 border-radius: 50%; background: none; color: var(--on-surface-variant); }
  .pane-toggle svg { width: 20px; height: 20px; }
  .pane-toggle[aria-expanded="false"] { color: var(--on-surface); background: var(--field); }
  .prominent { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 var(--s4); border-radius: 999px;
               background: var(--primary); background: var(--brand); color: #fff; font-size: 14px; font-weight: 600;
               text-decoration: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35),
               0 4px 13px color-mix(in oklch, var(--pp-deep) 38.2%, transparent); }
  .prominent svg { width: 16px; height: 16px; }
  [hidden] { display: none !important; }  /* Class display rules must not resurrect hidden parts. */

  /* Golden columns: 233 : main : 377 (Fibonacci). Either side pane can be closed (hidden). */
  .layout { display: grid; grid-template-areas: "rail main side"; grid-template-columns: 233px minmax(0, 1fr) 377px;
            gap: var(--s4); padding: var(--s4); min-height: 0; }
  .layout:has(> .rail[hidden]) { grid-template-areas: "main side"; grid-template-columns: minmax(0, 1fr) 377px; }
  .layout:has(> .side[hidden]) { grid-template-areas: "rail main"; grid-template-columns: 233px minmax(0, 1fr); }
  .layout:has(> .rail[hidden]):has(> .side[hidden]) { grid-template-areas: "main"; grid-template-columns: minmax(0, 1fr); }
  .rail { grid-area: rail; } .player { grid-area: main; } .side { grid-area: side; }
  .rail[hidden], .side[hidden] { display: none; }
  .rail, .side { min-height: 0; border-radius: var(--r-pane); }

  /* Slide list, like PowerPoint's thumbnail pane, on a glass sidebar. */
  .rail { overflow-y: auto; padding: var(--s2); }
  .rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s1); }
  .thumb { display: grid; grid-template-columns: 18px 1fr; gap: var(--s1) var(--s2); width: 100%; padding: var(--s1);
           border: 0; border-radius: var(--r-item); background: none; text-align: left; }
  .thumb .n { padding-top: 2px; font-size: 12px; color: var(--on-surface-variant); text-align: right; font-variant-numeric: tabular-nums; }
  .thumb .pic { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--r-small);
                border: 2px solid transparent; background: linear-gradient(#fff, #fff) padding-box, var(--hairline) border-box;
                box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
  .thumb .pic iframe { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; border: 0;
                       transform-origin: 0 0; transform: scale(var(--thumb-scale, .1)); pointer-events: none; }
  .thumb .cap { grid-column: 2; font-size: 12px; line-height: 1.35; color: var(--on-surface-variant);
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .thumb[aria-current="true"] { background: var(--primary-container); }
  .thumb[aria-current="true"] .pic { background: linear-gradient(#fff, #fff) padding-box, var(--brand-glow) border-box;
                                     box-shadow: 0 4px 13px rgba(0, 0, 0, .15); }
  .thumb[aria-current="true"] .n, .thumb[aria-current="true"] .cap { color: var(--on-primary-container); font-weight: 600; }

  /* Stage: the largest 16:9 screen that fits the column, centered; controls float on it in glass. */
  .player { min-width: 0; min-height: 0; container-type: size; display: flex; flex-direction: column;
            align-items: center; justify-content: center; --now-h: 76px; }
  .screen { position: relative; width: min(100cqw, (100cqh - var(--now-h)) * 16 / 9); border-radius: var(--r-pane);
            overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--hairline), var(--lift); }
  .stage { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
  /* html-deck slides are a fixed 1600x900 canvas; scale the whole frame to fit. */
  .stage iframe { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; border: 0; background: #fff;
                  transform-origin: center; }
  .catcher { position: absolute; inset: 0; }
  .screen:fullscreen { display: grid; border-radius: 0; }
  .screen:fullscreen .stage { aspect-ratio: auto; height: 100vh; }
  /* "Fill the window" mode: the screen covers the page; monitor fullscreen uses the Fullscreen API. */
  .screen.filled { position: fixed; inset: 0; z-index: 50; width: auto; border-radius: 0; box-shadow: none; }
  .screen.filled .stage { aspect-ratio: auto; height: 100vh; }
  /* The player's size container is its own stacking context; lift it above the side panes. */
  .player:has(.screen.filled) { position: relative; z-index: 50; }
  .screen.idle { cursor: none; }
  .controls { position: absolute; left: var(--s2); right: var(--s2); bottom: var(--s2); padding: var(--s1) var(--s3);
              border-radius: var(--r-item); color: #fff; transition: opacity .3s, transform .3s; }
  .controls.glass { background: rgba(30, 30, 34, .42); border-color: rgba(255, 255, 255, .18); }
  .screen.idle .controls { opacity: 0; transform: translateY(var(--s2)); pointer-events: none; }

  .seek { position: relative; height: 21px; margin: 0 var(--s1); }
  .seek .ticks { position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; pointer-events: none; z-index: 1; }
  .seek .ticks i { position: absolute; top: 0; width: 3px; height: 6px; margin-left: -1.5px; background: rgba(30, 30, 34, .9); }
  /* Progress fills with the warm gradient; the rest of the track stays a neutral gray. */
  input[type="range"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 21px; margin: 0;
                        background: none; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; transition: height .15s;
    background: linear-gradient(to right, transparent var(--p, 0%), #66666c var(--p, 0%)),
                var(--brand-glow); }
  .seek:hover input[type="range"]::-webkit-slider-runnable-track { height: 6px; }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: #66666c; }
  input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px;
    background: var(--brand-glow); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -4.5px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .45); transition: transform .15s; }
  .seek:hover input[type="range"]::-webkit-slider-thumb { margin-top: -3.5px; transform: scale(1.236); }
  input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: #fff; }

  /* Scrubbing preview (HIG: show a 160px thumbnail while people look for a moment). */
  .preview { position: absolute; bottom: 29px; width: 176px; padding: var(--s2); border-radius: var(--r-item);
             transform: translateX(-50%); pointer-events: none; opacity: 0; transition: opacity .15s; }
  .preview.glass { background: rgba(30, 30, 34, .55); border-color: rgba(255, 255, 255, .2); }
  .preview.show { opacity: 1; }
  .preview .pic { position: relative; width: 160px; height: 90px; overflow: hidden; border-radius: var(--s1); background: #fff; }
  .preview iframe { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; border: 0; transform-origin: 0 0; transform: scale(.1); }
  .preview .meta { display: flex; gap: 6px; margin-top: 6px; font-size: 12px; line-height: 1.3; }
  .preview .meta b { font-variant-numeric: tabular-nums; }
  .preview .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .8; }

  .row { display: flex; align-items: center; gap: 2px; }
  .icon { display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%;
          background: none; color: inherit; }
  .icon svg { width: 21px; height: 21px; }
  .icon.big { width: 44px; height: 44px; }
  .icon.big svg { width: 28px; height: 28px; }
  .time { margin: 0 var(--s2); font-size: 13px; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .85); white-space: nowrap; }
  .spacer { flex: 1; }
  .volume { display: flex; align-items: center; }
  .volume input { width: 0; opacity: 0; transition: width .2s, opacity .2s; }
  .volume:hover input, .volume:focus-within input { width: 89px; opacity: 1; margin-right: 6px; }
  .rate { height: 30px; padding: 0 var(--s3); border: 0; border-radius: 999px; background: rgba(255, 255, 255, .16); color: #fff;
          font-size: 13px; font-variant-numeric: tabular-nums; }
  .rate option { color: initial; }
  .full-wrap { position: relative; }
  .menu { position: absolute; right: 0; bottom: 48px; z-index: 2; min-width: 233px; margin: 0; padding: var(--s1); list-style: none;
          border-radius: var(--r-item); color: #fff; }
  .menu.glass { background: rgba(30, 30, 34, .62); border-color: rgba(255, 255, 255, .2); }
  .menu button { display: flex; align-items: center; gap: var(--s2); width: 100%; height: 40px; padding: 0 var(--s3); border: 0;
                 border-radius: var(--r-small); background: none; font-size: 14px; text-align: left; }
  .menu svg { width: 18px; height: 18px; flex: none; }
  .menu kbd { margin-left: auto; padding: 1px 6px; border-radius: 5px; background: rgba(255, 255, 255, .16);
              font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* Title under the screen, as wide as the screen, one line so the height budget (--now-h) holds. */
  .now { width: min(100cqw, (100cqh - var(--now-h)) * 16 / 9); height: var(--now-h); padding: var(--s3) var(--s1) 0; }
  .now-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 28px; }
  .voice-tools { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
  .voice-pick { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--s1) 0 var(--s2);
                border-radius: 999px; background: var(--field); color: var(--on-surface-variant); }
  .voice-pick svg { width: 16px; height: 16px; flex: none; }
  .voice-pick select { height: 100%; max-width: 13em; border: 0; background: none; color: var(--on-surface); font-size: 13px;
                       font-weight: 500; cursor: pointer; }
  .voice-pick select option { color: initial; }
  .voice-pick:focus-within { outline: 3px solid var(--primary); outline-offset: 1px; }
  .voice-pick select:focus-visible { outline: none; }  /* The pill draws the one ring. */
  .voice-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--on-surface-variant);
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .voice-status svg { width: 14px; height: 14px; flex: none; animation: spin 1s linear infinite; }
  .voice-status.error { color: var(--primary); white-space: normal; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .now .eyebrow { font-size: 13px; font-weight: 500; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
  .now h2 { margin: 2px 0 0; font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -.02em;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Transcript, like YouTube's, on a glass pane. */
  .side { display: flex; flex-direction: column; overflow: hidden; }
  .side-head { padding: var(--s4) var(--s4) var(--s3); }
  .side-head h2 { margin: 0 0 var(--s3); font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .search { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 var(--s3); border-radius: var(--r-item); background: var(--field); }
  .search svg { width: 16px; height: 16px; flex: none; color: var(--on-surface-variant); }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; }
  .search:focus-within { outline: 3px solid var(--primary); outline-offset: 1px; }
  .search input::placeholder { color: var(--on-surface-variant); }
  .opts { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: var(--s3); }
  /* Material 3 filter chip. */
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 var(--s3) 0 var(--s2); border-radius: var(--r-small);
          border: 1px solid var(--hairline); background: none; font-size: 13px; font-weight: 500; color: var(--on-surface-variant); }
  .chip svg { width: 16px; height: 16px; }
  .chip[aria-pressed="true"] { border-color: transparent; background: var(--primary-container); color: var(--on-primary-container); }
  .chip[aria-pressed="false"] svg { display: none; }
  .chip[aria-pressed="false"] { padding-left: var(--s3); }
  .text-button { height: 32px; padding: 0 var(--s3); border: 0; border-radius: 999px; background: none; color: var(--primary);
                 font-size: 13px; font-weight: 600; }
  .cues { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: var(--s1) var(--s2) var(--s3);
          border-top: 1px solid var(--hairline); }
  .chapter { position: sticky; top: 0; z-index: 1; display: flex; gap: var(--s2); align-items: baseline; margin: var(--s1) calc(-1 * var(--s2)) 2px;
             padding: var(--s2) var(--s4); font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--on-surface-variant);
             background: var(--glass-strong); backdrop-filter: blur(21px); -webkit-backdrop-filter: blur(21px); }
  .chapter span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cue { display: grid; grid-template-columns: auto 1fr; gap: var(--s3); align-items: start; padding: var(--s2) var(--s3);
         border-radius: var(--r-item); cursor: default; }
  .cue:hover { background: color-mix(in srgb, var(--on-surface) 5%, transparent); }
  .cue .ts { min-width: 50px; height: 26px; padding: 0 var(--s2); border: 0; border-radius: 999px; background: var(--field);
             color: var(--primary); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cue p { margin: 0; cursor: text; user-select: text; color: var(--on-surface-variant); transition: color .2s; }
  .cue[aria-current="true"] { background: var(--primary-container); }
  .cue[aria-current="true"] p { color: var(--on-surface); font-weight: 600; }
  .cue[aria-current="true"] .ts { background: var(--pp-deep); background: var(--brand); color: #fff; }
  .cue mark { background: var(--mark); color: inherit; border-radius: 3px; }
  .empty { padding: var(--s5) var(--s4); color: var(--on-surface-variant); text-align: center; }

  /* Medium windows: the slide list becomes a filmstrip under the screen. */
  @media (max-width: 1180px) {
    .layout { grid-template-areas: "main side" "rail side"; grid-template-columns: minmax(0, 1fr) 340px;
              grid-template-rows: minmax(0, 1fr) auto; }
    .layout:has(> .rail[hidden]) { grid-template-areas: "main side"; grid-template-columns: minmax(0, 1fr) 340px;
                                   grid-template-rows: minmax(0, 1fr); }
    .layout:has(> .side[hidden]) { grid-template-areas: "main" "rail"; grid-template-columns: minmax(0, 1fr); }
    .layout:has(> .rail[hidden]):has(> .side[hidden]) { grid-template-areas: "main"; grid-template-rows: minmax(0, 1fr); }
    .rail { overflow-x: auto; overflow-y: hidden; }
    .rail ol { grid-auto-flow: column; grid-auto-columns: 144px; }
  }
  /* Phones: an ordinary scrolling page, one column. */
  @media (max-width: 760px) {
    body { height: auto; display: block; overflow: visible; }
    header { position: sticky; top: var(--s2); margin: var(--s2) var(--s2) 0; padding-left: var(--s3); }
    header h1 { font-size: 15px; }
    header { gap: var(--s2); padding-left: var(--s2); }
    .prominent span { display: none; }
    .prominent { padding: 0 var(--s3); }
    .layout, .layout:has(> .rail[hidden]), .layout:has(> .side[hidden]), .layout:has(> .rail[hidden]):has(> .side[hidden]) {
      grid-template-areas: none; grid-template-columns: minmax(0, 1fr); grid-template-rows: none;
      gap: var(--s3); padding: var(--s3) var(--s3) var(--s4); }
    .rail, .player, .side { grid-area: auto; }
    .player { order: -1; container-type: normal; display: block; }
    .side { max-height: 70vh; }
    .screen, .now { width: auto; }
    .now { height: auto; }
    .now h2 { font-size: 19px; white-space: normal; }
    .rail ol { grid-auto-columns: 144px; }
    .skip, .volume input { display: none; }

<script>
const timeline = /*TIMELINE*/null;
const slides = timeline.slides;
const mainTimeline = structuredClone(timeline);  // slides[] is retimed in place when the voice changes.
let total = timeline.total_seconds;
const $ = (id) => document.getElementById(id);
const audio = $("audio"), frame = $("slide"), seek = $("seek"), cueList = $("cues"), screen = $("screen");
const reduced = matchMedia("(prefers-reduced-motion: reduce)");

                set: (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

}
document.querySelectorAll("[data-theme-choice]").forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.themeChoice)));
setTheme(document.documentElement.dataset.theme || "system");

// Every spoken sentence with its measured start; slides without cues fall back to one line.
const cueList_ = () => slides.flatMap((s, i) => (s.cues && s.cues.length ? s.cues : [{ text: s.title, start: s.start, end: s.end }])
  .map((c) => ({ ...c, slide: i })));
let cues = cueList_();

$("deck-title").textContent = document.title = timeline.title || slides[0].title;

seek.max = total;

});

const rows = [];
function renderCues(query = "") {
  cueList.replaceChildren();

  const q = query.trim().toLowerCase();
  let shown = 0, lastSlide = -1;
  cues.forEach((c, index) => {
    if (q && !c.text.toLowerCase().includes(q)) return;
    if (c.slide !== lastSlide) {
      lastSlide = c.slide;
      cueList.append(el("li", { className: "chapter" }, el("span", { textContent: c.slide + 1 }),
        el("span", { textContent: slides[c.slide].title })));
    }
    const text = el("p");
    if (q) {  // Highlight matches without parsing the script as HTML.

      }

  audio.currentTime = Math.max(0, Math.min(total, t + 0.001));

}

const moveSlide = (delta) => jump(slides[Math.max(0, Math.min(slides.length - 1, currentSlide + delta))].start);

  frame.style.transform = `translate(-50%, -50%) scale(${Math.min(stage.clientWidth / 1600, stage.clientHeight / 900)})`;
}
new ResizeObserver(fit).observe($("stage"));

// Controls fade out while playing and the pointer rests, like the system video player.
let idleTimer = 0;
function wake() {
  screen.classList.remove("idle");
  clearTimeout(idleTimer);
  if (audio.paused) return;
  idleTimer = setTimeout(() => {
    // Stay up while the pointer is on the controls, a menu is open or the keyboard is in them.
    const controls = $("controls");
    if (controls.matches(":hover") || controls.querySelector(":focus-visible") || !$("full-menu").hidden) wake();
    else screen.classList.add("idle");
  }, 2500);
}
for (const type of ["pointermove", "pointerdown", "focusin", "keydown"]) screen.addEventListener(type, wake);
screen.addEventListener("pointerleave", () => { if (!audio.paused) { clearTimeout(idleTimer); screen.classList.add("idle"); } });

// Two kinds of fullscreen: fill this browser window, or take over the monitor.
const monitorFull = () => document.fullscreenElement || document.webkitFullscreenElement;
const filled = () => screen.classList.contains("filled");
function fullChanged() {
  const on = Boolean(monitorFull()) || filled();
  setIcon("full-icon", on ? "minimize" : "maximize");
  $("full").setAttribute("aria-label", on ? "全画面を終了" : "全画面");
}
function closeMenu() { $("full-menu").hidden = true; $("full").setAttribute("aria-expanded", "false"); }
function fillWindow(on = !filled()) {
  closeMenu();
  screen.classList.toggle("filled", on);
  fullChanged();
}
async function fillMonitor() {
  closeMenu();
  if (monitorFull()) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  screen.classList.remove("filled");
  // Embedded browsers may refuse, or neither enter nor answer; filling the window still helps.
  setTimeout(() => { if (!monitorFull() && !filled()) fillWindow(true); }, 400);
  try { await (screen.requestFullscreen || screen.webkitRequestFullscreen).call(screen); }
  catch { fillWindow(true); }
}
function exitFull() {
  if (monitorFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  fillWindow(false);
}
$("full").addEventListener("click", () => {
  if (monitorFull() || filled()) return exitFull();
  const open = $("full-menu").hidden;
  $("full-menu").hidden = !open;
  $("full").setAttribute("aria-expanded", String(open));
  if (open) $("fill-window").focus();
});
$("fill-window").addEventListener("click", () => fillWindow(true));
$("fill-monitor").addEventListener("click", fillMonitor);
$("full-menu").addEventListener("keydown", (event) => {
  const items = [$("fill-window"), $("fill-monitor")];
  if (event.key === "ArrowDown" || event.key === "ArrowUp") {
    event.preventDefault();
    items[(items.indexOf(document.activeElement) + 1) % 2].focus();
  }
  if (event.key === "Escape") { closeMenu(); $("full").focus(); }
});
document.addEventListener("pointerdown", (event) => { if (!event.target.closest?.(".full-wrap")) closeMenu(); });
document.addEventListener("fullscreenchange", fullChanged);
document.addEventListener("webkitfullscreenchange", fullChanged);

// Scrubbing preview of the slide at the pointer.
let previewSlide = -1;
function preview(event) {
  const box = seek.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (event.clientX - box.left) / box.width));
  const t = ratio * total, index = lastAt(slides, t);
  if (index !== previewSlide) { previewSlide = index; $("preview-frame").src = slides[index].slide; }
  $("preview-time").textContent = clock(t);
  $("preview-title").textContent = slides[index].title;
  $("preview").style.left = `${Math.max(88, Math.min(box.width - 88, ratio * box.width))}px`;
  $("preview").classList.add("show");
}
seek.addEventListener("pointermove", preview);
seek.addEventListener("pointerleave", () => $("preview").classList.remove("show"));

// Resume where this deck was left off, without asking (HIG: resume playback automatically).
const resumeKey = `presenter-position:${location.pathname}:${total}`;
const saved = Number(store.get(resumeKey));
// A link like player.html#t=95 opens at that moment, as YouTube's t= does; it wins over the resume point.
const linked = Number(new URLSearchParams(location.hash.slice(1)).get("t"));
if (linked > 0) audio.currentTime = Math.min(linked, total);
else if (saved > 1 && saved < total - 1) audio.currentTime = saved;
let lastSaved = 0;
audio.addEventListener("timeupdate", () => {
  if (Math.abs(audio.currentTime - lastSaved) > 2) { lastSaved = audio.currentTime; store.set(resumeKey, lastSaved.toFixed(1)); }
});
audio.addEventListener("ended", () => store.set(resumeKey, null));

audio.addEventListener("timeupdate", update);
audio.addEventListener("seeked", update);
for (const type of ["play", "pause", "ended"]) audio.addEventListener(type, () => {
  const playing = !audio.paused && !audio.ended;
  setIcon("play-icon", playing ? "pause" : "play");
  $("play").setAttribute("aria-label", playing ? "一時停止" : "再生");
  wake();
});
audio.addEventListener("volumechange", () => {
  const silent = audio.muted || audio.volume === 0;
  setIcon("vol-icon", silent ? "volume-x" : "volume-2");
  $("mute").setAttribute("aria-label", silent ? "ミュート解除" : "ミュート");
  $("volume").value = audio.muted ? 0 : audio.volume;
  $("volume").style.setProperty("--p", `${$("volume").value * 100}%`);
});
$("volume").style.setProperty("--p", "100%");
seek.addEventListener("input", () => jump(Number(seek.value)));
$("catcher").addEventListener("click", toggle);
$("catcher").addEventListener("dblclick", () => (monitorFull() || filled() ? exitFull() : fillMonitor()));
$("play").addEventListener("click", toggle);
$("back").addEventListener("click", () => jump(audio.currentTime - 10));
$("fwd").addEventListener("click", () => jump(audio.currentTime + 10));
$("prev").addEventListener("click", () => moveSlide(-1));
$("next").addEventListener("click", () => moveSlide(1));
$("mute").addEventListener("click", () => { audio.muted = !audio.muted; });
$("volume").addEventListener("input", (e) => { audio.volume = Number(e.target.value); audio.muted = false; });
$("rate").addEventListener("change", (e) => { audio.playbackRate = Number(e.target.value); });
$("follow").addEventListener("click", (e) => {
  const on = !following();
  e.currentTarget.setAttribute("aria-pressed", on);
  if (on) { userScrolled = 0; scrollToCue(true); }
});
$("to-now").addEventListener("click", () => { userScrolled = 0; scrollToCue(true); });
for (const type of ["wheel", "touchmove"]) cueList.addEventListener(type, () => { userScrolled = Date.now(); }, { passive: true });

document.addEventListener("keydown", (event) => {
  const target = event.target;
  // Inputs, sliders, menus and buttons keep their own keys.
  if (target.closest?.("input, select, textarea, button") || event.ctrlKey || event.metaKey || event.altKey) return;
  const keys = { " ": toggle, k: toggle, ArrowLeft: () => jump(audio.currentTime - 5), ArrowRight: () => jump(audio.currentTime + 5),
    j: () => jump(audio.currentTime - 10), l: () => jump(audio.currentTime + 10), Home: () => jump(0), End: () => jump(total),
    PageUp: () => moveSlide(-1), PageDown: () => moveSlide(1), m: () => { audio.muted = !audio.muted; },
    f: fillMonitor, t: () => fillWindow(), Escape: () => fillWindow(false) };
  if (event.key === "Escape" && !filled()) return;  // Let the browser leave monitor fullscreen itself.
  const action = keys[event.shiftKey && event.key === "ArrowLeft" ? "PageUp" : event.shiftKey && event.key === "ArrowRight" ? "PageDown" : event.key];
  if (action) { event.preventDefault(); action(); }
});

// Side panes open and close from the header; the choice is remembered per browser.
const PANES = { rail: ["スライド一覧", "left"], side: ["文字起こし", "right"] };
function setPane(id, open) {
  const [name, edge] = PANES[id];
  $(id).hidden = !open;
  const button = $(`toggle-${id}`);
  button.setAttribute("aria-expanded", String(open));
  button.setAttribute("aria-label", `${name}を${open ? "閉じる" : "開く"}`);
  setIcon(`${id}-icon`, `panel-${edge}-${open ? "close" : "open"}`);
  store.set(`presenter-pane-${id}`, open ? null : "closed");
  if (open && id === "side") scrollToCue(true);
  if (open && id === "rail" && currentSlide >= 0) reveal($("rail"), thumbs[currentSlide]);
}
for (const id of Object.keys(PANES)) {
  $(`toggle-${id}`).addEventListener("click", () => setPane(id, $(id).hidden));
  setPane(id, store.get(`presenter-pane-${id}`) !== "closed");
}

// Voices. Each voice has its own timeline (the same sentences, timed by its own audio). A file://
// player switches between the voices embedded when it was written; `presenter-tts play` serves the
// player with an API that also lists voices without audio and synthesizes one when it is picked.
const VOICE_LABEL = (v) => (v.name === "default" ? "標準の声" : v.name) + (v.ready === false ? "（未作成）" : "");
const voiceKey = `presenter-voice:${location.pathname}`;
let voiceList = timeline.voices || [], currentVoice = timeline.voice || "default", serverMode = false;

function status(text, kind = "") {
  const box = $("voice-status");
  box.className = `voice-status ${kind}`;
  box.replaceChildren();
  if (kind === "busy") box.append(el("span", { innerHTML: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-loader-circle"/></svg>' }).firstChild);
  if (text) box.append(text);
}

function showVoices() {
  $("voice").replaceChildren(...voiceList.map((v) => el("option", { value: v.name, textContent: VOICE_LABEL(v), selected: v.name === currentVoice })));
  $("voice-pick").hidden = voiceList.length < 2;
}

async function switchTo(entry) {
  const base = new URL(entry.timeline, location.href);
  const next = entry.data || (entry.timeline === "timeline.json" && !serverMode ? mainTimeline : await (await fetch(base, { cache: "no-store" })).json());
  if (next.slides.length !== slides.length || next.slides.some((s, i) => s.id !== slides[i].id)) {
    throw new Error("スライドの構成が違う音声です。narrate で作り直してください");
  }
  const sentence = Math.max(0, currentCue), playing = !audio.paused && !audio.ended;
  next.slides.forEach((s, i) => Object.assign(slides[i], { start: s.start, end: s.end, cues: s.cues }));
  total = next.total_seconds;
  cues = cueList_();
  seek.max = total;
  drawMarks();
  audio.src = new URL("narration.wav", base).href;
  // Stay on the same sentence; the new voice says it at its own time.
  audio.currentTime = cues[Math.min(sentence, cues.length - 1)].start;
  setVideo(entry.video ? new URL(entry.video, base).href : null);
  currentVoice = entry.name;
  store.set(voiceKey, entry.name === (timeline.voice || "default") ? null : entry.name);
  renderCues($("search").value);
  showVoices();
  if (playing) audio.play();
}

const sleep = (ms) => new Promise((done) => setTimeout(done, ms));
async function synthesize(name) {
  const started = await fetch("/api/narrate", { method: "POST", headers: { "Content-Type": "application/json" },
                                                body: JSON.stringify({ voice: name }) });
  if (!started.ok) throw new Error((await started.json()).error);
  for (;;) {
    const job = await (await fetch("/api/job", { cache: "no-store" })).json();
    if (job.state === "error") throw new Error(job.message || "音声を作れませんでした");
    if (job.state === "done" && job.voice === name) return;
    status(`${VOICE_LABEL({ name })}の音声を作成中${job.total ? ` ${job.done}/${job.total}` : "…"}`, "busy");
    await sleep(1000);
  }
}

async function chooseVoice(name) {
  try {
    let entry = voiceList.find((v) => v.name === name);
    if (entry.ready === false) {
      $("voice").disabled = true;
      await synthesize(name);
      voiceList = (await (await fetch("/api/voices", { cache: "no-store" })).json()).voices;
      entry = voiceList.find((v) => v.name === name);
    }
    await switchTo(entry);
    status("");
  } catch (error) {
    status(error.message, "error");
    showVoices();  // Back to the voice that is playing.
  } finally {
    $("voice").disabled = false;
  }
}
$("voice").addEventListener("change", (e) => chooseVoice(e.target.value));

async function loadVoices() {
  if (location.protocol.startsWith("http")) {
    try {
      const answer = await fetch("/api/voices", { cache: "no-store" });
      if (answer.ok) { voiceList = (await answer.json()).voices; serverMode = true; }
    } catch {}
  }
  showVoices();
  const remembered = store.get(voiceKey);
  const entry = voiceList.find((v) => v.name === remembered && v.ready !== false);
  if (entry && entry.name !== currentVoice) chooseVoice(entry.name);
}

renderCues();
loadVoices();
</script>
</body>
</html>
